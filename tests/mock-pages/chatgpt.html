<!DOCTYPE html>
<html><head><title>ChatGPT Mock</title></head>
<body>
<!-- ChatGPT uses data-message-author-role="user" / "assistant" -->
<div class="conversation">
  <div data-message-author-role="user">
    <p>Explain the difference between TCP and UDP</p>
  </div>
  <div data-message-author-role="assistant">
    <p>TCP is a connection-oriented protocol...</p>
  </div>
  <div data-message-author-role="user">
    <p>When would I choose UDP over TCP?</p>
  </div>
  <div data-message-author-role="assistant">
    <p>UDP is preferred for real-time applications...</p>
  </div>
  <div data-message-author-role="user">
    <p>How does TCP handle packet loss?</p>
  </div>
  <div data-message-author-role="assistant">
    <p>TCP uses acknowledgments and retransmission...</p>
  </div>
  <div data-message-author-role="user">
    <p>What about QUIC protocol?</p>
  </div>
</div>
</body>
</html>
