<!DOCTYPE html>
<html><head><title>Replit Mock</title></head>
<body>
<!-- Replit: Real DOM structure (from live site inspection, Feb 2026).
     Replit uses Emotion CSS-in-JS with CSS Module hash classes that change per deployment.
     Key stable attributes: data-cy="user-message", data-event-type="user-message".

     DOM nesting per user message:
       A: div.EventRenderer-module_{hash}_userMessage (outer event wrapper)
         B: div[data-cy="user-message"][data-event-type="user-message"] (message wrapper — correct target)
           C: div.UserMessage-module_{hash}_userMessageSurfaceShades (outer surface)
             D: span (layout wrapper)
               E: div.UserMessage-module_{hash}_userMessageSurfaceShades[data-acknowledged="true"] (bubble)
                 F: div.rendered-markdown
                   G: div.Markdown-module_{hash}_markdownTheme
                     H: <p>actual text</p>

     Important: A, C, and E all contain "userMessage" in class names. Using class-based
     selectors without dedup will return 3 elements per message. The correct selector is
     data-cy="user-message" (element B), which returns exactly 1 per message.

     The AutoScroller container wraps the entire chat history. -->
<div class="workspace" style="display:flex;width:100%;">
  <div class="chat-pane" style="width:40%;height:100vh;display:flex;flex-direction:column;">
    <div class="useView-module_etopAW_view AutoScroller-module_ZCuA_W" style="--AutoScroller-first-child-margin:0;--AutoScroller-scroll-height:681px;flex:1;overflow-y:auto;">
      <div class="useView-module_etopAW_view AutoScroller-module_ZCuA_W_scroll" style="padding:6px 4px 14px 4px;">
        <div class="useView-module_etopAW_view AutoScroller-module_ZCuA_W_content" style="display:flex;flex-direction:column;">

          <!-- User message 1 -->
          <div class="useView-module_etopAW_view EventRenderer-module_RTGgnG_userMessage EventContainer-module_PvCvrW_eventContainer" style="display:flex;flex-direction:column;transition:background-color 0.3s;">
            <div class="useView-module_etopAW_view useView-module_etopAW_isHorizontal" data-cy="user-message" data-event-type="user-message" style="display:flex;gap:8px;justify-content:flex-end;padding:16px 0 16px 32px;">
              <div class="useView-module_etopAW_view UserMessage-module_wrN9Aa_userMessageSurfaceShades" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
                <span class="useView-module_etopAW_view" style="display:flex;">
                  <div class="useView-module_etopAW_view sdz_notice sdz_surface-bg UserMessage-module_wrN9Aa_userMessageSurfaceShades" data-acknowledged="true" style="padding:6px 8px;border-radius:4px;background:#2a2a2a;">
                    <div class="rendered-markdown">
                      <div class="Markdown-module_KWqogW_markdownTheme Markdown-module_KWqogW_inheritShadesTextColor">
                        <p>Create a Flask API with SQLAlchemy ORM and user authentication</p>
                      </div>
                    </div>
                  </div>
                </span>
              </div>
            </div>
          </div>

          <!-- Assistant message (EventRenderer without userMessage class) -->
          <div class="useView-module_etopAW_view EventRenderer-module_RTGgnG_agentAction EventContainer-module_PvCvrW_eventContainer" style="display:flex;flex-direction:column;">
            <div class="useView-module_etopAW_view" style="padding:8px;">
              <p>I'll set up the Flask project with SQLAlchemy...</p>
            </div>
          </div>

          <!-- User message 2 -->
          <div class="useView-module_etopAW_view EventRenderer-module_RTGgnG_userMessage EventContainer-module_PvCvrW_eventContainer" style="display:flex;flex-direction:column;transition:background-color 0.3s;">
            <div class="useView-module_etopAW_view useView-module_etopAW_isHorizontal" data-cy="user-message" data-event-type="user-message" style="display:flex;gap:8px;justify-content:flex-end;padding:16px 0 16px 32px;">
              <div class="useView-module_etopAW_view UserMessage-module_wrN9Aa_userMessageSurfaceShades" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
                <span class="useView-module_etopAW_view" style="display:flex;">
                  <div class="useView-module_etopAW_view sdz_notice sdz_surface-bg UserMessage-module_wrN9Aa_userMessageSurfaceShades" data-acknowledged="true" style="padding:6px 8px;border-radius:4px;background:#2a2a2a;">
                    <div class="rendered-markdown">
                      <div class="Markdown-module_KWqogW_markdownTheme Markdown-module_KWqogW_inheritShadesTextColor">
                        <p>Add rate limiting and request validation middleware</p>
                      </div>
                    </div>
                  </div>
                </span>
              </div>
            </div>
          </div>

          <!-- Assistant message -->
          <div class="useView-module_etopAW_view EventRenderer-module_RTGgnG_agentAction EventContainer-module_PvCvrW_eventContainer" style="display:flex;flex-direction:column;">
            <div class="useView-module_etopAW_view" style="padding:8px;">
              <p>I've added Flask-Limiter for rate limiting...</p>
            </div>
          </div>

          <!-- User message 3 -->
          <div class="useView-module_etopAW_view EventRenderer-module_RTGgnG_userMessage EventContainer-module_PvCvrW_eventContainer" style="display:flex;flex-direction:column;transition:background-color 0.3s;">
            <div class="useView-module_etopAW_view useView-module_etopAW_isHorizontal" data-cy="user-message" data-event-type="user-message" style="display:flex;gap:8px;justify-content:flex-end;padding:16px 0 16px 32px;">
              <div class="useView-module_etopAW_view UserMessage-module_wrN9Aa_userMessageSurfaceShades" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
                <span class="useView-module_etopAW_view" style="display:flex;">
                  <div class="useView-module_etopAW_view sdz_notice sdz_surface-bg UserMessage-module_wrN9Aa_userMessageSurfaceShades" data-acknowledged="true" style="padding:6px 8px;border-radius:4px;background:#2a2a2a;">
                    <div class="rendered-markdown">
                      <div class="Markdown-module_KWqogW_markdownTheme Markdown-module_KWqogW_inheritShadesTextColor">
                        <p>Deploy this to Replit with environment variables for secrets</p>
                      </div>
                    </div>
                  </div>
                </span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
    <textarea placeholder="Message Replit AI..."></textarea>
  </div>
  <div class="preview-pane" style="width:60%;">
    <iframe style="width:100%;height:100vh;"></iframe>
  </div>
</div>
</body>
</html>
