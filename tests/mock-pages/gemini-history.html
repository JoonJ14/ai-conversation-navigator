<!DOCTYPE html>
<html><head><title>Gemini History Mock</title>
<!-- Gemini (gemini.google.com) with its history loading modelled (v12.16 part C, DEC-057).
     Used by probes/check-gemini-history.js; not part of the 14-platform suite (tests/mock-pages/
     gemini.html stays the static mock).

     WHAT IS MODELLED (measured live, Chrome + Tampermonkey, visible tab, 2026-10-31):
       - The chat's latest turns render at once (0 -> 10 turns in one step), view at the bottom.
       - Older turns load a page (10) at a time when the scroller reaches the top: 10 -> 20 -> 30 -> 32
         on a 32-question chat. Every loaded turn is KEPT (no virtualizer, no recycling).
       - The scroller is <infinite-scroller class="chat-history">; its direct children are
         <div class="conversation-container" id="<16 hex>">, one per turn, ids stable across loads.
         Each holds <user-query> (div.query-text > span.cdk-visually-hidden "You said" +
         p.query-text-line) and <model-response>.
       - Gemini re-anchors scrollTop when it prepends (live 5975 -> 9064 after 10 turns above):
         config `anchor` (default true) adds the prepended height to scrollTop.
       - A history load takes seconds (live it blocks the main thread): config `loadDelayMs`
         (default 2000) between reaching the top and the prepend. No checks depend on its value.
       - Nothing in the DOM marks "more history"; user-query-content-N ids restart at 0 per render.
       - Off-screen turns carry turn-content-visibility: their height is an estimate until they render,
         and a glide from the top to the latest question grew scrollHeight under it (59,324 -> 63,126 px),
         leaving the target 4,240 px below the view. Measured live: turns are `content-visibility: auto`
         with `contain-intrinsic-size: auto 500px`, and the scroller keeps the browser's scroll anchoring
         (`overflow-anchor: auto`). Config `cv` (off by default) gives every turn an estimated height
         (`cvEstimate`, default 500 px, the live value) until it first comes within half a view of the
         scroller's view, settled on each scroll event (an ordering, not a timing window), and turns
         the scroller's anchoring on, as live.
     NOT modelled: the main-thread block itself (unless blockMs is set), Gemini's real heights, streaming
     (beyond sendStreaming's even growth of one paragraph, v12.19).

     v12.19 (DEC-063): Gemini's history READ, opt-in through `rpc` (absent = no token, no server: the
     page is exactly the v12.18 mock). Measured live, v12.19 Phase 1 (Chrome page realm, the owner's
     profile, visible tab, chat 96b519c1, 32 questions, 2026-11-05) and Phase 0 (G0, Chrome +
     Tampermonkey 5.5.1, Firefox + Tampermonkey 5.5.0, Safari + Userscripts 4.8.6):
       - POST /_/BardChatUi/data/batchexecute?rpcids=hNvQHb, a form body f.req + at, the page's cookies.
         f.req = [[["hNvQHb", "<args JSON>", null, "generic"]]]; args = ["c_<chat>", size, cursor, ...].
       - The answer: ")]}'", a blank line, then per frame a length line and a ONE-line JSON frame:
         [["wrb.fr","hNvQHb","<payload JSON string>",null,null,null,"generic"]],
         [["di",n],["af.httprm",n,"<id>",n]], and with rt=c a last [["e",4,null,null,<len>]] (without
         rt=c the e frame is absent: Phase 1).
       - payload = [turns NEWEST FIRST, cursor (145 chars) or null on the last page, null, []].
       - turn = [[c_<chat>, r_<16 hex>], [c_<chat>, r_<16 hex>, rc_<16 hex>], query (11 slots, [0][0] the
         question), response (32 slots: [0] the candidates, [3] the rc_ shown), [seconds (10 digits),
         nanos (9 digits)]]. The r_ hex equals the DOM container's id (32/32, order-exact): here the
         payload's ids ARE turnId(), the same FNV ids the DOM renders. A candidate's [1] holds the
         answer's markdown; its [12] is the heavy rich-content slot (10.7M of 12.66M chars live).
         Phase 1 saw ONE candidate per turn (cands: 1 on every turn, Chrome page realm, chat 96b519c1);
         a turn with drafts (several candidates, [3] naming one that is not the first) is unmeasured live:
         rpc.drafts models it.
       - A null payload carries its code at wrb.fr[5] (G0 reads it there; [7] measured with the
         credentials omitted; [3] and [5] are public-only).
       - A missing or wrong `at` answers HTTP 400 with an "er" frame (its inner slots are synthetic).
       - `at` = WIZ_global_data's token: 42 chars (a 28-char head, ':', a 13-digit ms timestamp), in
         one of 4 (of 18) inline scripts that carry WIZ_global_data.
       - Timing: size 100, 32 turns in ONE call, 6.2 s; the page's own size-10 pages 1.9-2.9 s; small
         chats 0.35-0.43 s (the default delay here, 400 ms).
     NOT modelled for the read: the payload's scale (heavyChars, default 2,000 per turn, is not the live
     10.7M), the live length-line unit (lenUnit picks one; a parser must ignore the numbers), the
     candidate's slot count (38 here; only [0], [1] and [12] were measured), streaming answers (beyond
     sendStreaming's "what is written so far"), the Gem
     and /u/N/ DOM (their paths are accepted here; both forms are guesses, unmeasured live).

     CONFIG (window.__MOCK_CONFIG, set before this body):
       chats:       { <16-hex chat id>: <turn count> }  the chat shown is location.pathname's /app/<id>
       page:        turns per load (default 10)
       loadDelayMs: delay from reaching the top (scrollTop <= 50) to the prepend (default 2000)
       anchor:      re-anchor scrollTop on a prepend (default true)
       firstDelayMs: delay before the first page renders (default 200), so a script sees 0 then 10
       cv:          the content-visibility model above (default false); cvEstimate: its height (500)
       sameText:    { n: m } turn n asks turn m's question, word for word (v12.17; default none)
       bigAnswers:  { n: chars } turn n's answer carries one more paragraph of that many characters
                    (v12.18; default none): input for the context meter's size dots and (v12.19, review
                    round 1, check-gemini-index I12k) turns whose real height is several times cv's
                    estimate; not a live measurement
       (v12.19; every key below is off by default)
       rpc:         the history read's server, see above: { at, decoyAt, freshAt, noToken, mode, lenUnit,
                    delayMs: { full, next, newest }, heavyChars, drafts }. at: the token in the inline script;
                    decoyAt: a later script sets the page GLOBAL to this other value (a reader of globals
                    sends it and is refused); noToken: the WIZ script carries no token; mode: 'ok' (default),
                    'refuse' (403), 'abort', 'hang', 'null7' / 'null3' / 'null5' (a null payload, the code at
                    wrb.fr[5]), 'stale-at' (the first request is refused 400 and the page's token rotates to
                    freshAt), 'bad-at' (every request 400), 'noprefix', 'garbage' (the wrb.fr frame is not
                    JSON), 'noentry' (no hNvQHb frame), 'badpayload' (the payload string is not JSON), 'shape'
                    (the payload's turns are not a list), 'cursor-repeat' (the second page repeats the first
                    cursor), 'empty-cursor' (a page of no turns with a cursor); lenUnit: 'chars' (default) or
                    'bytes'. Any request whose `at` is not the page's current token is refused 400.
                    drafts (Tier 3 r1; UNMEASURED live, see the turn's shape above): true | { word }: each
                    turn's response lists TWO candidates, [0] a draft the page does not show ("Draft n: ...",
                    naming `word`, default 'platypus', and nothing else), [1] the answer the DOM shows, which
                    R[3] names by its rc_ id: a reader that takes [0][0] instead of the one [3] names lists
                    the draft.
                    endless: every page carries a fresh cursor (the read lists a chat of 1,000,000 turns,
                    synthetic, past the script's page cap); empty: 'newest' | 'full' | 'all', that kind of
                    request answers a page of no turns and no cursor (never seen live; Phase 1 saw a null
                    cursor only on a last page that had turns)
                    firstNewest (review round 1; the server's view of a turn just sent is UNMEASURED live):
                    the FIRST newest-page read after a send() answers late, once: 'drop' leaves the newest
                    turn out (a turn the server does not list yet), 'half' holds the first half of the
                    newest turn's answer markdown (an answer caught mid-write that has finished on the page)
       domOrder:    { drop: n } turn n is never rendered in the DOM (the read lists it); { swap: [a, b] }
                    turns a and b render in each other's place, each with its own id and text (the
                    self-check's gap and order rules; not live measurements)
       mismatch:    { turn, text } | { turn, id }: the DOM shows another question text / container id for
                    that turn; the read's payload keeps the true one
       qText:       { n: text } turn n's question (DOM and payload)
       answerWords: { n: word } turn n's answer gains a paragraph naming that word (DOM and payload)
       images:      { n: k } k uploaded images (img[data-test-id="uploaded-img"], data: URLs) beside turn
                    n's question text, as live (a sibling of div.query-text)
       blockMs:     a synchronous busy-wait before each prepend: the live render block (~4.6 s, DEC-057)
       stallAt:     history stops loading once this many turns are in the DOM (a load that never comes)
       endlessDom:  (review round 1) history never ends: once the chat's first turn is in, each load at the
                    top prepends a page of OLDER turns the read does not list, their ids not 16-hex (so the
                    self-check compares none of them). Synthetic: no live chat pages past its start; it lets
                    a jump reach its per-jump page cap (with domOrder { drop: 1 }, turn 1 never mounts)
       Paths: /app/<id>, and the unmeasured /u/<N>/app/<id> and /gem/<gem>/<id>.

     window.__mockGemini:
       loaded()        turns currently in the DOM
       total()         the current chat's turn count
       pending()       true while a history load is scheduled
       loads()         history loads done in this chat
       loadAll()       synchronously prepend every remaining turn, anchored (one DOM step)
       switchTo(id)    history.pushState to /app/<id>, then render that chat's first page
       goHome()        (v12.19, review round 1) history.pushState to /app, then an empty scroller: the chat
                       left for Gemini's home, so going back to it is the same chat visit (live Gemini's
                       home page is not modelled, only its path and that no turn is shown)
       send(text)      append a new turn at the bottom (a message the user sent), view to the bottom
       userScroll(w)   'top' | 'bottom' | <number>: a scroll as a user makes it (wheel, then the write)
       turnId(n)       the stable id of turn n (1-based) in the current chat
       (v12.19)
       domId(n)        the id turn n's container carries in the DOM (turnId(n) unless `mismatch` moves it)
       editQuestion(n, text)  rewrite turn n's question text in the DOM (the payload keeps its own)
       sendStreaming(text, { chars, ms, stepMs, tail })  send(text) whose answer is WRITTEN: one paragraph
                       growing every stepMs (default 1,000: the script scans after 500 ms with no
                       mutation, so a faster stream gets no scan until it stops) to `chars` characters
                       (default 12,000) over `ms` (default 30,000), ending with the word `tail`; the
                       read's server lists what is written so far (the live server's view of an answer
                       being written is unmeasured, and so is Gemini's streaming cadence)
       rpc(body, url, method) the server's answer to one request: { status, text, delayMs } | { kind:
                       'abort' | 'hang' }; the probe's route bridge calls it, so the request takes the
                       real network path. Records the call (never the token's value).
       calls()         { full, next, newest, other, list: [{ type, size, cursorIn, cursorOut, atOk, rt,
                       status }] } (full: no cursor and size >= 100; newest: no cursor, smaller; next: a cursor)
       setAt(v)        rewrite the token script's text (a script that ran does not run again) and make v
                       the token the server accepts
       topTriggers()   history loads scheduled by the view reaching the top
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #131314; color: #e3e3e3;
    font-family: 'Google Sans', 'Helvetica Neue', sans-serif;
    display: flex; flex-direction: column;
  }
  infinite-scroller.chat-history {
    display: block; flex: 1; min-height: 0; overflow-y: auto; overflow-anchor: none;
  }
  .conversation-container { max-width: 768px; margin: 0 auto; padding: 12px 24px; box-sizing: border-box; }
  user-query { display: block; margin: 16px 0 8px; }
  .user-query-container { display: flex; flex-direction: column; }
  user-query-content { display: block; }
  .file-preview-container { display: none; }
  .query-content { display: flex; flex-direction: column; }
  .user-query-bubble-with-background {
    display: inline-flex; background: #1e1f20; border-radius: 20px; padding: 10px 16px;
    max-width: 60%; align-self: flex-end;
  }
  .horizontal-container { display: flex; align-items: center; gap: 8px; }
  .query-text { font-size: 16px; line-height: 24px; word-break: break-word; }
  .query-text-line { margin: 0; }
  .cdk-visually-hidden {
    border: 0; clip: rect(0 0 0 0); height: 1px; margin: -1px; overflow: hidden; padding: 0;
    position: absolute; width: 1px; white-space: nowrap;
  }
  model-response { display: block; margin: 8px 0 16px; }
  .model-response-text { font-size: 16px; line-height: 24px; color: #c4c7c5; }
  .model-response-text p { margin: 8px 0; }
  .input-area-container { padding: 16px 24px; display: flex; justify-content: center; }
  .prompt-input {
    width: 100%; max-width: 768px; padding: 12px 16px; border-radius: 24px; border: 1px solid #3c4043;
    background: #1b1b1f; color: #e3e3e3; font-size: 16px; box-sizing: border-box;
  }
</style>
</head>
<body>
<infinite-scroller class="chat-history"></infinite-scroller>
<div class="input-area-container"><input class="prompt-input" placeholder="Ask Gemini" type="text"></div>
<script>
(function () {
    var cfg = window.__MOCK_CONFIG || {};
    var CHATS = cfg.chats || {};
    var PAGE = cfg.page || 10;
    var DELAY = typeof cfg.loadDelayMs === 'number' ? cfg.loadDelayMs : 2000;
    var ANCHOR = cfg.anchor !== false;
    var FIRST = typeof cfg.firstDelayMs === 'number' ? cfg.firstDelayMs : 200;
    var CV = !!cfg.cv;
    var CV_EST = typeof cfg.cvEstimate === 'number' ? cfg.cvEstimate : 500;
    var BLOCK = typeof cfg.blockMs === 'number' ? cfg.blockMs : 0;
    var STALL = typeof cfg.stallAt === 'number' ? cfg.stallAt : 0;
    var ENDLESS = !!cfg.endlessDom;
    var sc = document.querySelector('infinite-scroller.chat-history');

    var TOPICS = ['orbital transfer windows', 'tidal locking of moons', 'the Roche limit', 'gravity assists',
                  'Lagrange points', 'escape velocity', 'atmospheric drag on satellites', 'precession of orbits',
                  'Hohmann transfers', 'the Oberth effect', 'synchronous orbits', 'three-body chaos'];

    var state = { chat: null, total: 0, first: 0, sent: 0, pending: false, gen: 0, loads: 0, triggers: 0, sentText: {},
                  streamText: {}, older: 0 };

    function fnv(s) {
        var h = 0x811c9dc5;
        for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
        return ('0000000' + h.toString(16)).slice(-8);
    }
    function turnId(chat, n) { return fnv(chat + '#' + n) + fnv(n + '@' + chat); }
    function questionText(n) {
        if (state.sentText.hasOwnProperty(n)) return state.sentText[n];
        if (cfg.qText && cfg.qText[n]) return cfg.qText[n];
        // sameText (v12.17): { n: m } gives turn n turn m's question, a repeated question.
        if (cfg.sameText && cfg.sameText[n]) n = cfg.sameText[n];
        var t = TOPICS[(n * 7) % TOPICS.length], u = TOPICS[(n * 5 + 3) % TOPICS.length];
        return 'Gemini question ' + n + ': how would you explain ' + t + ' to someone who already knows ' + u +
               ', and which everyday example makes the difference between them easiest to see?';
    }
    // An answer's paragraphs: the DOM renders each as a <p>; the read's payload carries them as
    // markdown joined by blank lines (v12.19), so both say the same thing.
    function answerParas(n) {
        // sendStreaming (v12.19): what has been written so far, one paragraph.
        if (state.streamText.hasOwnProperty(n)) return state.streamText[n] ? [state.streamText[n]] : [];
        var paras = 2 + (n * 3) % 4, out = [];
        for (var i = 0; i < paras; i++) {
            out.push('Answer ' + n + ', part ' + (i + 1) + ': the short version is that the motion is set by ' +
                     'energy and angular momentum, and everything else follows from how those two trade off over ' +
                     'one orbit. A worked example helps more than a formula here, so consider a ball on a string.');
        }
        if (cfg.answerWords && cfg.answerWords[n]) out.push('A note on ' + cfg.answerWords[n] + ' as well.');
        if (cfg.bigAnswers && cfg.bigAnswers[n]) {
            out.push(new Array(Math.ceil(cfg.bigAnswers[n] / 10) + 1).join('orbit data').slice(0, cfg.bigAnswers[n]));
        }
        return out;
    }
    function answerHtml(n) {
        var p = answerParas(n), out = '';
        for (var i = 0; i < p.length; i++) out += '<p>' + p[i] + '</p>';
        return out;
    }
    function answerText(n) { return answerParas(n).join('\n\n'); }
    // The id the turn's container carries in the DOM: turnId, unless `mismatch` moves it (v12.19).
    function domId(chat, n) {
        var m = cfg.mismatch;
        return (m && m.turn === n && m.id) ? m.id : turnId(chat, n);
    }
    function shownQuestion(n) {
        var m = cfg.mismatch;
        return (m && m.turn === n && typeof m.text === 'string') ? m.text : questionText(n);
    }
    // Uploaded images beside the question text, as live (user-query-file-carousel is a sibling of
    // div.query-text, which is why the script queries them document-wide).
    function imagesHtml(n) {
        var k = cfg.images && cfg.images[n], out = '';
        if (!k) return '';
        for (var j = 1; j <= k; j++) {
            var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><rect width='96' height='96' fill='#" +
                      fnv('img' + n + '.' + j).slice(0, 6) + "'/><text x='10' y='56' font-size='22'>" + n + '.' + j + '</text></svg>';
            out += '<img data-test-id="uploaded-img" width="96" height="96" alt="upload ' + n + '.' + j +
                   '" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '">';
        }
        return '<user-query-file-carousel class="file-carousel">' + out + '</user-query-file-carousel>';
    }
    function makeTurn(chat, n, idx, text) {
        var d = document.createElement('div');
        d.className = 'conversation-container';
        d.id = domId(chat, n);
        d.setAttribute('data-mock-turn', String(n));
        d.innerHTML =
            '<user-query><span class="user-query-container">' +
            '<user-query-content class="user-query-container" style="--max-lines-for-collapse-count: 5;">' +
            '<div class="user-query-container"><div class="file-preview-container ng-star-inserted"></div>' +
            '<div id="user-query-content-' + idx + '" class="query-content ng-star-inserted" data-turn="user">' +
            '<div class="ng-star-inserted"></div>' +
            '<span class="user-query-bubble-with-background ng-star-inserted"><span class="horizontal-container">' +
            imagesHtml(n) +
            '<div class="query-text gds-body-l query-text-animated" role="heading" aria-level="5" dir="ltr">' +
            '<span class="cdk-visually-hidden screen-reader-user-query-label">You said</span>' +
            '<p class="query-text-line ng-star-inserted"></p></div>' +
            '<button class="mdc-icon-button" aria-label="Expand text" style="display:none"></button>' +
            '</span></span></div></div></user-query-content></span></user-query>' +
            '<model-response><div class="response-container"><div class="response-content">' +
            '<div class="model-response-label-announcer"><h2 class="cdk-visually-hidden screen-reader-model-response-label">Gemini said</h2></div>' +
            '<structured-content-container class="model-response-text">' + answerHtml(n) + '</structured-content-container>' +
            '<div class="response-footer"></div></div></div></model-response>';
        d.querySelector('p.query-text-line').textContent = text || shownQuestion(n);
        if (CV) { d.className += ' mock-cv-unseen'; d.style.height = CV_EST + 'px'; d.style.overflow = 'hidden'; }
        return d;
    }

    // cv: a turn takes its real height the first time it comes within half a view of the scroller's
    // view, repeated until nothing new qualifies (the browser settles content-visibility before it
    // paints). A glide passes every turn on its way and renders them all; an instant write skips the
    // ones between, which is the difference measured live.
    function cvReveal() {
        if (!CV) return;
        for (var pass = 0; pass < 50; pass++) {
            var r = sc.getBoundingClientRect(), m = sc.clientHeight / 2, u = sc.querySelectorAll('.mock-cv-unseen'), any = false;
            for (var i = 0; i < u.length; i++) {
                var b = u[i].getBoundingClientRect();
                if (b.bottom > r.top - m && b.top < r.bottom + m) {
                    u[i].classList.remove('mock-cv-unseen'); u[i].style.height = ''; u[i].style.overflow = ''; any = true;
                }
            }
            if (!any) return;
        }
    }
    sc.addEventListener('scroll', cvReveal, { passive: true });
    if (CV) sc.style.overflowAnchor = 'auto';

    // user-query-content-N restarts at 0 per render (live), counting from the top of what is shown.
    function renumber() {
        var q = sc.querySelectorAll('.query-content');
        for (var i = 0; i < q.length; i++) q[i].id = 'user-query-content-' + i;
    }

    // domOrder (v12.19): the turns from..to as the DOM renders them, one left out or two swapped.
    function shownTurns(from, to) {
        var D = cfg.domOrder, ns = [], n;
        for (n = from; n <= to; n++) if (!(D && D.drop === n)) ns.push(n);
        if (D && D.swap) {
            var i = ns.indexOf(D.swap[0]), j = ns.indexOf(D.swap[1]);
            if (i >= 0 && j >= 0) { var t = ns[i]; ns[i] = ns[j]; ns[j] = t; }
        }
        return ns;
    }

    function prepend(count) {
        var from = state.first - count, frag = document.createDocumentFragment(), ns = shownTurns(from, state.first - 1);
        for (var i = 0; i < ns.length; i++) frag.appendChild(makeTurn(state.chat, ns[i], 0));
        var h0 = sc.scrollHeight, top0 = sc.scrollTop;
        sc.insertBefore(frag, sc.firstChild);
        state.first = from;
        renumber();
        if (ANCHOR) sc.scrollTop = top0 + (sc.scrollHeight - h0);
        state.loads++;
    }
    // endlessDom (review round 1): a page of turns older than the chat's first, which the read does not list.
    function prependOlder(count) {
        var frag = document.createDocumentFragment();
        for (var i = count; i >= 1; i--) {
            var k = state.older + i;
            var d = makeTurn(state.chat, 1, 0, 'An older turn the read does not list (' + k + ')');
            d.id = 'mock-older-' + k;
            d.setAttribute('data-mock-turn', 'older-' + k);
            frag.appendChild(d);
        }
        state.older += count;
        var h0 = sc.scrollHeight, top0 = sc.scrollTop;
        sc.insertBefore(frag, sc.firstChild);
        renumber();
        if (ANCHOR) sc.scrollTop = top0 + (sc.scrollHeight - h0);
        state.loads++;
    }

    function render(chat) {
        state.gen++;
        state.pending = false;
        state.chat = chat;
        state.total = CHATS[chat] || 0;
        state.sent = 0;
        state.sentText = {};
        state.streamText = {};
        state.loads = 0;
        state.triggers = 0;
        state.older = 0;
        while (sc.firstChild) sc.removeChild(sc.firstChild);
        state.first = state.total + 1;
        var gen = state.gen;
        setTimeout(function () {
            if (gen !== state.gen) return;
            var k = Math.min(PAGE, state.total), frag = document.createDocumentFragment();
            state.first = state.total - k + 1;
            var ns = shownTurns(state.first, state.total);
            for (var i = 0; i < ns.length; i++) frag.appendChild(makeTurn(chat, ns[i], 0));
            sc.appendChild(frag);
            renumber();
            sc.scrollTop = sc.scrollHeight;
            cvReveal();
        }, FIRST);
    }

    sc.addEventListener('scroll', function () {
        if (state.pending || (state.first <= 1 && !ENDLESS) || sc.scrollTop > 50) return;
        // stallAt (v12.19): history that stops coming, e.g. a page load that fails.
        if (STALL && sc.querySelectorAll(':scope > .conversation-container').length >= STALL) return;
        state.pending = true;
        state.triggers++;
        var gen = state.gen;
        setTimeout(function () {
            if (gen !== state.gen) return;
            // blockMs (v12.19): rendering a page blocks the main thread (~4.6 s live, DEC-057), so no
            // timer of anyone's runs until the turns are in.
