<!DOCTYPE html>
<html><head><title>Claude Code Mock</title></head>
<body>
<!-- Claude Code: no data-testid attributes. User messages are right-aligned
     bg-bg-200 rounded-lg bubbles inside items-end containers -->
<div class="conversation">
  <div class="items-end" style="display:flex;flex-direction:column;align-items:flex-end;">
    <div class="bg-bg-200 rounded-lg" style="padding:12px;">
      <p>Help me refactor this authentication module</p>
    </div>
  </div>
  <div class="assistant-message" style="width:100%;">
    <p>I'll help you refactor the authentication module...</p>
  </div>
  <div class="items-end" style="display:flex;flex-direction:column;align-items:flex-end;">
    <div class="bg-bg-200 rounded-lg" style="padding:12px;">
      <p>Now add error handling for expired tokens</p>
    </div>
  </div>
  <div class="assistant-message" style="width:100%;">
    <p>Here's the updated code with token expiry handling...</p>
  </div>
  <div class="items-end" style="display:flex;flex-direction:column;align-items:flex-end;">
    <div class="bg-bg-200 rounded-lg" style="padding:12px;">
      <p>Can you also write tests for the refresh token flow?</p>
    </div>
  </div>
</div>
</body>
</html>
