<!DOCTYPE html>
<html><head><title>Firebase Studio Mock</title></head>
<body>
<!-- Firebase Studio: CSS module classes with _chatMessage_ and _isUser_ patterns.
     The hash suffix changes per build but the semantic prefixes stay.
     Message body text is inside _messageBody_ nested elements. -->
<div class="app-container">
  <div class="_chatContainer_x1y2z_10" style="max-width:48rem;margin:0 auto;">
    <!-- User message: has both _chatMessage_ and _isUser_ classes -->
    <div class="_chatMessage_qlgvg_30 _isUser_qlgvg_47" style="padding:12px;margin-bottom:8px;margin-left:auto;background:#2a2a2a;border-radius:12px;">
      <div class="_messageBody_qlgvg_55">
        <p>Create a Firebase Cloud Functions API for user management</p>
      </div>
    </div>
    <!-- Assistant message: _chatMessage_ but NOT _isUser_ -->
    <div class="_chatMessage_qlgvg_30" style="padding:12px;margin-bottom:8px;">
      <div class="_messageBody_qlgvg_55">
        <p>I'll create the Cloud Functions for user management...</p>
      </div>
    </div>
    <!-- User message -->
    <div class="_chatMessage_qlgvg_30 _isUser_qlgvg_47" style="padding:12px;margin-bottom:8px;margin-left:auto;background:#2a2a2a;border-radius:12px;">
      <div class="_messageBody_qlgvg_55">
        <p>Add Firestore security rules and real-time listeners</p>
      </div>
    </div>
    <!-- Assistant message -->
    <div class="_chatMessage_qlgvg_30" style="padding:12px;margin-bottom:8px;">
      <div class="_messageBody_qlgvg_55">
        <p>I've set up Firestore security rules with real-time sync...</p>
      </div>
    </div>
    <!-- User message -->
    <div class="_chatMessage_qlgvg_30 _isUser_qlgvg_47" style="padding:12px;margin-bottom:8px;margin-left:auto;background:#2a2a2a;border-radius:12px;">
      <div class="_messageBody_qlgvg_55">
        <p>Now integrate Firebase Auth with Google and GitHub sign-in</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
