name: Cross-Platform Tests

# The CI rebuild (ROADMAP 0e; the owner's decisions of 2026-11-11). Until v12.19 every ubuntu job ran the suite and
# then all 17 probe steps one after another (~46-47 minutes under a 60-minute stopgap cap). Now:
#   - changes: the docs-only fast path (.github/scripts/docs-only.sh).
#   - the suite: the same 9 jobs and names ("<browser> on <os>"); ubuntu in Playwright's container image.
#   - probes: 9 ubuntu jobs, one engine and two lanes each (.github/scripts/probe-lanes.sh). Layout B, the owner's
#     choice for GitHub Free's 20 concurrent jobs: the 9 + 9 run at once (18), with `changes` before them and
#     `ci-ok` after. (claude-code-review.yml is disabled on GitHub and takes no slot.)
#   - ci-ok: the one required check. It needs every job above and fails unless each succeeded, or was skipped by
#     the docs-only rule.
# Probe placement is unchanged: the string probes (tokenizer, subsegments, usage-state) on chromium only, since
# they assert pure string behaviour; every other probe on all three engines, because each asserts fetch, timer,
# scroll, storage or scan timing that varies by engine (webkit is Safari's); ubuntu only, since the runner OS adds
# nothing to an engine question and Windows and macOS carry documented flake modes (DEC-036; TESTING.md).
# History of the caps and the install stalls: ROADMAP 0e.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR cancels that PR's run still in progress (two runs of 18 jobs at once would queue each other in 20
# slots). Pushes to main and manual runs each get a group of their own, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The detector comes from the BASE branch, never from the PR: a PR's own edit to docs-only.sh is itself a
      # non-doc change, so it cannot decide to skip its own tests (Tier 3 round 1). A base without the detector
      # (before this workflow merged) runs everything.
      - name: Docs-only fast path (the base branch's detector)
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; echo "event '$EVENT': everything runs"; exit 0
          fi
          if ! git show "$BASE:.github/scripts/docs-only.sh" > "$RUNNER_TEMP/docs-only.sh" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; echo "the base ($BASE) has no docs-only detector: everything runs"; exit 0
          fi
          bash "$RUNNER_TEMP/docs-only.sh" "$EVENT" "$BASE" "$HEAD"

  # Ubuntu runs in Playwright's own image: the browsers and their system packages are preinstalled for exactly the
  # pinned Playwright, so no job downloads apt packages (the mirror stalled for 10-25 minutes, ROADMAP 0e) or races
  # npm for an unpinned release. --user 1001 is the runner's uid (Firefox refuses root); --ipc=host gives the
  # browsers the host's shared memory; --init reaps the browsers' child processes.
  test-ubuntu:
    name: "${{ matrix.browser }} on ubuntu-latest"
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # A healthy job: the suite (5m43s-5m47s on run 42437401493) and its setup. 30, as macOS and Windows.
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright (pinned by package-lock.json)
        run: npm ci

      - name: Versions
        shell: bash
        run: node -e "const os = require('os'); console.log('node ' + process.version + ', playwright ' + require('playwright/package.json').version + ', cpus ' + os.cpus().length + ', memory ' + (os.totalmem() / 1e9).toFixed(1) + ' GB')"

      - name: Run tests
        run: node tests/test-all-platforms.js --browser ${{ matrix.browser }}

  test-other:
    name: "${{ matrix.browser }} on ${{ matrix.os }}"
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    # Healthy jobs take 6-10 minutes (macOS 6m10s-6m58s, Windows 5m43s-8m31s on run 42437401493). Without a limit
    # GitHub lets a job run 6 hours, and a degraded macOS runner burned 40+ minutes twice on 2026-07-30.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright (pinned by package-lock.json)
        run: npm ci

      - name: Install browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Versions
        shell: bash
        run: node -e "const os = require('os'); console.log('node ' + process.version + ', playwright ' + require('playwright/package.json').version + ', cpus ' + os.cpus().length + ', memory ' + (os.totalmem() / 1e9).toFixed(1) + ' GB')"

      - name: Run tests
        run: node tests/test-all-platforms.js --browser ${{ matrix.browser }}

  # Each job runs two lanes side by side; probe-lanes.sh names their probes and CI's time for each.
  probes:
    name: "probes ${{ matrix.group }} (${{ matrix.browser }})"
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # The longest lane is ~7 minutes of probes (CI times, one probe at a time) plus setup: 20 is about 2.5x.
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        group: [gemini-index, features+bookmarks, meter+jumps]
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright (pinned by package-lock.json)
        run: npm ci

      - name: Versions
        shell: bash
        run: node -e "const os = require('os'); console.log('node ' + process.version + ', playwright ' + require('playwright/package.json').version + ', cpus ' + os.cpus().length + ', memory ' + (os.totalmem() / 1e9).toFixed(1) + ' GB')"

      - name: Run probes (two lanes)
        env:
          GROUP: ${{ matrix.group }}
          BROWSER: ${{ matrix.browser }}
        run: bash .github/scripts/probe-lanes.sh "$GROUP" "$BROWSER"

  # The one required check (the owner, 2026-11-11). It always runs, and fails unless every job it needs succeeded,
  # or was skipped because changes said docs-only. A skipped required check counts as passing on GitHub, which is
  # why this gate exists and never skips itself. It checks twice:
  #   1. each needed job's result (a matrix job's is the aggregate of its legs);
  #   2. every leg by name, from this run's jobs (the latest attempt of each, so a re-run counts). A matrix leg
  #      cancelled before any runner picked it up has been reported to leave the aggregate at "success" (GitHub
  #      community discussion 211624, 2026-10-30, a user's report with three runs; this repo had such cancels on
  #      macOS on 2026-11-05), so the aggregate alone is not enough (Tier 3 round 1).
  # A job added to this workflow must be added to needs: and to the expected list below; an unknown job fails.
  ci-ok:
    name: ci-ok
    needs: [changes, test-ubuntu, test-other, probes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Every job succeeded (or was skipped as docs-only)
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES: ${{ needs.changes.result }}
          TEST_UBUNTU: ${{ needs.test-ubuntu.result }}
          TEST_OTHER: ${{ needs.test-other.result }}
          PROBES: ${{ needs.probes.result }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          bad=0
          fail() { echo "::error::$1"; bad=1; }
          echo "needs: docs_only=$DOCS_ONLY changes=$CHANGES test-ubuntu=$TEST_UBUNTU test-other=$TEST_OTHER probes=$PROBES"
          [ "$CHANGES" = success ] || fail "changes: $CHANGES"
          docs=false
          if [ "$DOCS_ONLY" = true ] && [ "$CHANGES" = success ]; then docs=true; fi
          for pair in "test-ubuntu=$TEST_UBUNTU" "test-other=$TEST_OTHER" "probes=$PROBES"; do
            job=${pair%%=*}; result=${pair#*=}
            if [ "$result" = success ]; then continue; fi
            if [ "$result" = skipped ] && [ "$docs" = true ]; then continue; fi
            fail "$job: $result"
          done

          expected=changes
          for os in ubuntu-latest macos-latest windows-latest; do
            for b in chromium firefox webkit; do expected="$expected"$'\n'"$b on $os"; done
          done
          for g in gemini-index features+bookmarks meter+jumps; do
            for b in chromium firefox webkit; do expected="$expected"$'\n'"probes $g ($b)"; done
          done

          # Read every attempt's jobs and keep each name's newest (highest run_attempt, then id), so a partial re-run
          # (gh run rerun --failed) is judged by the re-run jobs and the earlier attempt's successes alike, whichever
          # attempts the API lists them under (Tier 3 round 2). Wait (up to ~30 s) only for the API to show every
          # job completed.
          jobs=""
          for try in 1 2 3 4 5 6 7; do
            raw=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" \
                    --jq '.jobs[] | select(.name != "ci-ok") | "\(.name)\t\(.run_attempt)\t\(.id)\t\(.status)\t\(.conclusion)"') || raw=""
            # Per name: the newest attempt; the row with the highest id there, printed once per entry in that attempt,
            # so two jobs with one name in one attempt still read "listed 2 times".
            jobs=$(printf '%s\n' "$raw" | awk -F'\t' 'NF {
                     att = $2 + 0; jid = $3 + 0
                     if (!($1 in a) || att > a[$1]) { a[$1] = att; n[$1] = 0; best[$1] = -1 }
                     if (att == a[$1]) { n[$1]++; if (jid > best[$1]) { best[$1] = jid; row[$1] = $1 "\t" $4 "\t" $5 } }
                   } END { for (k in row) for (i = 0; i < n[k]; i++) print row[k] }' | sort)
            pending=$(printf '%s\n' "$jobs" | awk -F'\t' 'NF && $2 != "completed"' | wc -l)
            if [ -n "$jobs" ] && [ "$pending" -eq 0 ]; then break; fi
            sleep 5
          done
          echo "this run's jobs (name, status, conclusion):"
          printf '%s\n' "$jobs" | sed 's/^/  /'
          [ -n "$jobs" ] || fail "could not read this run's jobs"

          if [ "$docs" = true ]; then
            # Nothing ran but changes: every other job is skipped (a skipped matrix job is listed unexpanded).
            while IFS=$'\t' read -r name status concl; do
              [ -n "$name" ] || continue
              if [ "$name" = changes ]; then [ "$concl" = success ] || fail "$name: $concl"
              else [ "$concl" = skipped ] || fail "$name: $concl (docs-only: every job but changes should be skipped)"; fi
            done <<< "$jobs"
          else
            while IFS= read -r want; do
              n=$(printf '%s\n' "$jobs" | awk -F'\t' -v w="$want" '$1 == w' | wc -l)
              c=$(printf '%s\n' "$jobs" | awk -F'\t' -v w="$want" '$1 == w { print $3; exit }')
              if [ "$n" -ne 1 ]; then fail "$want: listed $n times in this run"
              elif [ "$c" != success ]; then fail "$want: $c"; fi
            done <<< "$expected"
            while IFS=$'\t' read -r name status concl; do
              [ -n "$name" ] || continue
              printf '%s\n' "$expected" | grep -qxF -- "$name" || fail "$name ($concl): not in ci-ok's expected list (add it there and to needs:)"
            done <<< "$jobs"
          fi

          if [ "$bad" != 0 ]; then exit 1; fi
          if [ "$docs" = true ]; then echo "ci-ok: docs-only, every other job skipped"
          else echo "ci-ok: all $(printf '%s\n' "$expected" | wc -l | tr -d ' ') jobs succeeded"; fi
