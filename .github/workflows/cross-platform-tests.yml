name: Cross-Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: "${{ matrix.browser }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    # Healthy jobs run 5m41s-9m47s (observed across the 9-job matrix). Without
    # a limit, GitHub lets a job run 6 HOURS - and a degraded macos runner
    # burned 40+ minutes twice on 2026-07-30 (webkit/macos: same code, same
    # image, same Playwright build as green runs minutes earlier). 20 minutes
    # is 2x the slowest healthy job; a sick host now fails fast and visibly
    # instead of blocking the PR for an hour. Queue time does not count.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install playwright

      - name: Install browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: node tests/test-all-platforms.js --browser ${{ matrix.browser }}

      # The probe assertions gate properties the Playwright suite structurally cannot
      # see. Measured, not assumed (Tier 3 lens 3, PR #70): a build with the widened
      # character class but the English `length > 2` filter restored — i.e. the variant
      # v12.7 explicitly rejected — passes the Korean fixture 31/31, and so does a build
      # with the two downstream length re-checks put back. The fixture's topic list is
      # entirely bigrams drawn from its constant base text, so nothing that depends on
      # 2-syllable Korean nouns ever reaches an assertion there. check-tokenizer T4 and
      # T12 are what fail on those two builds.
      #
      # ONE job only (ubuntu + chromium). These probes assert pure string behaviour, which
      # does not vary by runner or engine — the browser is used solely to execute the
      # shipped function in situ. Running them in all 9 jobs would buy no coverage and add
      # 9x the flake surface, on a matrix that already has two documented webkit-on-macos
      # failure modes (DEC-036) and a page.goto race on Windows.
      - name: Run probe assertions
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium'
        run: |
          node probes/check-tokenizer.js --browser chromium
          node probes/check-subsegments.js --browser chromium
          node probes/check-usage-state.js --browser chromium
