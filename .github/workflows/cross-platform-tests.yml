name: Cross-Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: "${{ matrix.browser }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    # Healthy jobs run 5m41s-9m47s (observed across the 9-job matrix). Without
    # a limit, GitHub lets a job run 6 HOURS - and a degraded macos runner
    # burned 40+ minutes twice on 2026-07-30 (webkit/macos: same code, same
    # image, same Playwright build as green runs minutes earlier). 20 minutes
    # is 2x the slowest healthy job; a sick host now fails fast and visibly
    # instead of blocking the PR for an hour. Queue time does not count.
    # v12.15: the ubuntu jobs, which run every probe, took 13m42s-13m59s on
    # 2026-10-25 before three more probes (about 5 minutes locally) joined them,
    # so 20 minutes no longer covers a healthy ubuntu job; 30 does, with room.
    # v12.17 (the owner, 2026-11-01): 40 on ubuntu, as a stopgap until the CI rebuild (ROADMAP
    # 0e). Those jobs took 23m28s-24m6s on v12.16 (PR #90's run), and this PR's probes add about
    # 4-5 minutes; macOS and Windows run no probes and keep 30.
    # v12.18 (the owner, 2026-11-05; still a stopgap until the rebuild): 50 on ubuntu. Measured on
    # v12.17 (21-22 runs, PR #92 and 8909d92): healthy ubuntu jobs 27.3-30.3 min (suite ~6, probes
    # ~22). The merge run 41871676757 lost webkit/ubuntu at 40m11s because a slow apt mirror made
    # "Install browser engine" take 10m54s (181 kB/s; 4 s normally); PR #92's run 41459811313 hit
    # the same stall (39.0 min) and passed. 30.3 + ~11 = ~41 min, plus this PR's two probes (about
    # 4.3-4.6 min per engine in the final local run; ~2 min in the first sweep): ~46. Measured
    # afterwards on PR #93's run 42095450049 (3ccf84b): healthy ubuntu jobs 33m18s-33m51s, so 50
    # absorbs an install stall of only ~16 min; a 25-min stall cut firefox/ubuntu at 50m19s
    # (hence the bounded install step below). The merge run's two macOS cancels at 15m01s were GitHub
    # not assigning a runner ("not acquired by Runner ... after multiple attempts"), which no
    # setting here changes: re-run the failed jobs once the whole run has finished.
    # v12.19 (Tier 3 r1): 60 on ubuntu. The owner chose 50 in v12.18, before this PR's "Run Gemini index
    # probe" step existed; that step is why. It took ~9.8 minutes per engine when the cap was set (588 s for
    # 67 checks, 589 s for 72), and 741 s (~12.4 minutes) for review round 1's last gates (b6f1aa2, 79
    # checks), measured locally on chromium only (this machine, 2026-11-07; 489-502 s on 2026-11-06
    # against v12.18, where many fixtures end early; Firefox, WebKit and CI not measured). A healthy ubuntu
    # job: 33m18s-33m51s (PR #93's run 42095450049) + ~12.4 = ~46.2 minutes. The bounded install's worst
    # case that still passes is its third attempt finishing at the 4-minute limit: 3 x 240 s, plus up to
    # 15 s of kill-after and a 3 s pause after each failed attempt, ~12.5-13 minutes where a healthy install
    # takes 18-40 s (already in the 33 minutes). ~46.2 + ~13 = ~59.2 of 60 minutes: under 1 minute of
    # headroom by these local figures; under 50 such a job was cut off. A stall past that fails the install
    # step itself (3 attempts, then exit 1), visibly.
    # macOS and Windows run no probes and keep 30.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install playwright

      - name: Install browser engine
        if: matrix.os != 'ubuntu-latest'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Ubuntu: the system packages come from the runner's apt mirror, which stalls. Measured on
      # v12.17/v12.18 runs: "Need to get 48.8 MB" (Firefox) / "114 MB" (WebKit) fetched from
      # azure.archive.ubuntu.com in 24m10s (32.3 kB/s), 15m53s (43.6 kB/s) and 10m30s (181 kB/s),
      # while the package lists came at 7-9 MB/s, the browser from Playwright's CDN in 3-4 s, and a
      # healthy install took 18-40 s. A stall past ~16 min ran a ~34-minute job into its 50-minute
      # cap. So (the owner, 2026-11-05; ROADMAP 0e): the packages get up to 3 attempts of 4 minutes
      # each, the later ones without the Azure mirror when the runner's mirror list has another, and
      # a mirror that stays slow fails this step in ~13 minutes, visibly, instead of the whole job.
      # No test or probe is retried; the browser download itself is unchanged.
      - name: Install browser engine (ubuntu, bounded)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 16
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          ok=0
          for attempt in 1 2 3; do
            if timeout --kill-after=15s 240s npx playwright install-deps "$BROWSER"; then ok=1; break; fi
            echo "::warning::system packages for $BROWSER, attempt $attempt: not done in 4 minutes (the apt mirror is slow)"
            sudo pkill -TERM -x apt-get || true
            sleep 3
            sudo dpkg --configure -a || true
            if [ "$attempt" = 1 ] && [ -f /etc/apt/apt-mirrors.txt ]; then
              echo "apt mirror list:"; cat /etc/apt/apt-mirrors.txt
              if awk '!/azure\.archive\.ubuntu\.com/ && NF { f = 1 } END { exit !f }' /etc/apt/apt-mirrors.txt; then
                sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
                echo "attempts 2-3 use the next mirror in the list"
              fi
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "::error::system packages for $BROWSER: 3 attempts of 4 minutes did not finish; the Ubuntu apt mirror is stalled. Re-run this job."
            exit 1
          fi
          npx playwright install "$BROWSER"

      - name: Run tests
        run: node tests/test-all-platforms.js --browser ${{ matrix.browser }}

      # The probe assertions gate properties the Playwright suite structurally cannot
      # see. Measured, not assumed (Tier 3 lens 3, PR #70): a build with the widened
      # character class but the English `length > 2` filter restored — i.e. the variant
      # v12.7 explicitly rejected — passes the Korean fixture 31/31, and so does a build
      # with the two downstream length re-checks put back. The fixture's topic list is
      # entirely bigrams drawn from its constant base text, so nothing that depends on
      # 2-syllable Korean nouns ever reaches an assertion there. check-tokenizer T4 and
      # T12 are what fail on those two builds.
      #
      # ONE job only (ubuntu + chromium). These probes assert pure string behaviour, which
      # does not vary by runner or engine — the browser is used solely to execute the
      # shipped function in situ. Running them in all 9 jobs would buy no coverage and add
      # 9x the flake surface, on a matrix that already has two documented webkit-on-macos
      # failure modes (DEC-036) and a page.goto race on Windows.
      - name: Run probe assertions
        if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium'
        run: |
          node probes/check-tokenizer.js --browser chromium
          node probes/check-subsegments.js --browser chromium
          node probes/check-usage-state.js --browser chromium

      # The transport-ladder probe is the exception to "one job only": it asserts fetch,
      # promise and timer behaviour (a synchronous throw, a rejected fetch, the backoff
      # schedule), and that is exactly what DOES vary by engine — webkit is the Safari
      # engine the v12.9 fix exists for. So it runs on all three engines, on ubuntu only:
      # the runner OS adds nothing to an engine question, and Windows/macOS carry the
      # documented flake modes above. (v12.9, DEC-045)
      - name: Run transport-ladder probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-transport-ladder.js --browser ${{ matrix.browser }}

      # The ChatGPT/Perplexity index-adapter probe (v12.10): placed like the ladder probe and
      # for the same reason — it asserts fetch, timer and scroll-event behaviour (the
      # Perplexity scroller's stick-to-bottom pin is released by a wheel event), which is
      # what varies by engine.
      - name: Run index-adapter probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-index-adapters.js --browser ${{ matrix.browser }}

      # Claude's turn-counter dots probe (v12.11): placed like the two above. It asserts an order of
      # events (index latency, the observer's 500 ms debounce, MutationObserver delivery), and the
      # bug it gates was seen only on Safari, so webkit runs it too.
      - name: Run turn-counter probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-turn-counter.js --browser ${{ matrix.browser }}

      # The GM storage probe (v12.12): placed like the three above. It asserts promise and timer
      # behaviour (the async GM.getValue load at startup, its 2 s bound), and Safari, the runtime
      # it exists for, is webkit's engine.
      - name: Run GM storage probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-gm-storage.js --browser ${{ matrix.browser }}

      # The answer-bookmark probe (v12.14, DEC-051): placed like the four above. It asserts scan timing
      # (the 500 ms debounce), the jump, and both storage APIs, and the owner's answer bookmarks failed
      # on all three browsers.
      - name: Run answer-bookmark probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-answer-bookmarks.js --browser ${{ matrix.browser }}

      # The v12.15 probes: placed like the five above. The jump probe asserts where one click lands
      # under scroll, mount and timer behaviour (a smooth glide is cancelled differently per engine);
      # the ChatGPT/Perplexity bookmark probe and the Claude turn-key probe assert scan timing, the
      # refetch cooldown and both storage APIs, and the owner's failures were seen on all three browsers.
      - name: Run index-jump probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-ix-jumps.js --browser ${{ matrix.browser }}

      - name: Run ChatGPT/Perplexity bookmark probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-ix-bookmarks.js --browser ${{ matrix.browser }}

      - name: Run Claude turn-key probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-claude-turnkeys.js --browser ${{ matrix.browser }}

      # The v12.16 probes: placed like the ones above. The far-jump probe asserts where one click
      # lands under scroll, mount and timer behaviour (a smooth glide is handled differently per
      # engine); the context-limit probe asserts the meter's limit per conversation model across a
      # conversation switch and SSE redraws; the Gemini probe asserts paging, the scan debounce and
      # an 8 s real-time wait. The owner's acceptance covers all three browsers.
      - name: Run Claude far-jump probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-claude-far-jump.js --browser ${{ matrix.browser }}

      - name: Run context-limit probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-ctx-limit.js --browser ${{ matrix.browser }}

      - name: Run Gemini history probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-gemini-history.js --browser ${{ matrix.browser }}

      # v12.19: Gemini's full question list from its own history read (DEC-063): the read's shape and
      # failure classes, the self-check, the refresh, jumps that page the DOM in, and the "Load full
      # history" fallback. Placed like the ones above: it asserts request counts over real-time windows
      # (20-25 s), paging waits and trusted-wheel cancels, which differ per engine.
      - name: Run Gemini index probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-gemini-index.js --browser ${{ matrix.browser }}

      # v12.17: Search, Export, Summary and the gallery read the whole conversation on Claude,
      # ChatGPT, Perplexity and Gemini, and Gemini bookmarks key to the turn id (DEC-059).
      - name: Run feature-gaps probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-feature-gaps.js --browser ${{ matrix.browser }}

      # v12.18: the context meter on Claude, ChatGPT, Gemini and Perplexity (DEC-060), and ChatGPT
      # answer bookmarks on a "fallback" turn. Placed like the ones above: both read the meter and
      # the flags after scans, refetches and storage writes, which differ per engine.
      - name: Run context-meter probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-context-meter.js --browser ${{ matrix.browser }}

      - name: Run ChatGPT fallback-turn bookmark probe
        if: matrix.os == 'ubuntu-latest'
        run: node probes/check-gpt-fallback.js --browser ${{ matrix.browser }}
