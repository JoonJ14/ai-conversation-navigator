name: Cross-Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: "${{ matrix.browser }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    # Healthy jobs run 5m41s-9m47s (observed across the 9-job matrix). Without
    # a limit, GitHub lets a job run 6 HOURS - and a degraded macos runner
    # burned 40+ minutes twice on 2026-07-30 (webkit/macos: same code, same
    # image, same Playwright build as green runs minutes earlier). 20 minutes
    # is 2x the slowest healthy job; a sick host now fails fast and visibly
    # instead of blocking the PR for an hour. Queue time does not count.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install playwright

      - name: Install browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: node tests/test-all-platforms.js --browser ${{ matrix.browser }}
